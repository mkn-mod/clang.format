#! clean build -O

name: clang.format
property:
  # dependency versions: master on master (not the default branch: mkn.mod's and parse.yaml's is
  #  the rolling latest, whose mkn.kul differs from a master project's)
  mkn.mod.version: master
  parse.yaml.version: master

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  dep: mkn.mod#${mkn.mod.version}
  if_dep:
    bsd: parse.yaml#${parse.yaml.version}[lib]
    win: parse.yaml#${parse.yaml.version}[lib]
  if_arg:
      win_static: -DYAML_CPP_STATIC_DEFINE
      shared: -DMKN_KUL_SHARED

- name: test
  mod: clang.format#master

- name: format
  mod: |
    clang.format#master{init{style: google, paths: .}}
