#! clean build -O

name: clang.format
property:
  # dependency versions: master on master (not the default branch: mkn.mod's is
  #  the rolling latest, whose mkn.kul differs from a master project's)
  mkn.mod.version: latest

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  dep: mkn.mod#${mkn.mod.version}
  if_arg:
      shared: -DMKN_KUL_SHARED

- name: test
  mod: clang.format#latest

- name: format
  mod: |
    clang.format#latest{init{style: google, paths: .}}
