#! clean build -O

name: clang.format

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  dep: mkn.mod
  if_dep:
    bsd: parse.yaml[lib]
    win: parse.yaml[lib]
  if_arg:
      win_static: -DYAML_CPP_STATIC_DEFINE
      shared: -DMKN_KUL_SHARED

- name: format
  mod: |
    clang.format{init{style: google, paths: .}}
